<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study2026 - Weekly Study Plan</title>
    <!-- استدعاء خطوط وأيقونات لتصميم فخم بستايل Notion -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-sun: #e3b341;
            --accent-mon: #3fb950;
            --accent-tue: #58a6ff;
            --accent-wed: #a371f7;
            --accent-thu: #f0883e;
            --accent-fri: #f85149;
            --accent-sat: #db61a2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* شاشة تسجيل الدخول */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 17, 21, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .login-card h2 {
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .login-card input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 15px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
        }

        .login-card button {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-card button:hover {
            background: #2ea043;
        }

        .error-msg {
            color: var(--accent-fri);
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        /* المحتوى الرئيسي */
        .main-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            flex: 1;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-secondary);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: var(--border-color);
        }

        /* شريط التقدم */
        .progress-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .progress-bar-wrapper {
            flex: 1;
            background: var(--bg-color);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-tue), var(--accent-mon));
            width: 0%;
            transition: width 0.4s ease;
        }

        .progress-text {
            font-weight: bold;
            font-size: 16px;
            min-width: 45px;
            text-align: left;
        }

        /* جدول الجدول الأسبوعي */
        .table-responsive {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            margin-bottom: 30px;
        }

        .study-grid {
            display: grid;
            grid-template-columns: 100px repeat(7, minmax(150px, 1fr));
            width: 100%;
            min-width: 1150px;
            border-collapse: collapse;
        }

        .grid-header {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
            font-size: 15px;
        }

        .time-col {
            background: var(--bg-color);
            color: var(--text-secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
            font-weight: 600;
        }

        .day-sun { color: var(--accent-sun); border-top: 4px solid var(--accent-sun); }
        .day-mon { color: var(--accent-mon); border-top: 4px solid var(--accent-mon); }
        .day-tue { color: var(--accent-tue); border-top: 4px solid var(--accent-tue); }
        .day-wed { color: var(--accent-wed); border-top: 4px solid var(--accent-wed); }
        .day-thu { color: var(--accent-thu); border-top: 4px solid var(--accent-thu); }
        .day-fri { color: var(--accent-fri); border-top: 4px solid var(--accent-fri); }
        .day-sat { color: var(--accent-sat); border-top: 4px solid var(--accent-sat); }

        .grid-cell {
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            border-left: 1px solid var(--border-color);
            min-height: 70px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(22, 27, 34, 0.6);
        }

        .task-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            gap: 5px;
        }

        .task-item.completed {
            opacity: 0.5;
            text-decoration: line-through;
            border-color: #238636;
        }

        .task-item input[type="checkbox"] {
            accent-color: var(--accent-mon);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .task-name {
            flex: 1;
            word-break: break-word;
        }

        .delete-task {
            background: none;
            border: none;
            color: var(--accent-fri);
            cursor: pointer;
            font-size: 12px;
            opacity: 0.7;
        }

        .delete-task:hover {
            opacity: 1;
        }

        /* أزرار الإضافة والتنقل */
        .actions-bar {
            text-align: center;
            margin-bottom: 40px;
        }

        .add-btn {
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
            transition: transform 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
        }

        /* نافذة إضافة مهمة */
        #task-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 17, 21, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
        }

        .modal-content h3 {
            margin-bottom: 15px;
        }

        .modal-content select, .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-actions button {
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }

        .btn-save { background: #238636; color: white; }
        .btn-cancel { background: var(--border-color); color: var(--text-primary); }

        /* شريط التنقل السفلي */
        .bottom-nav {
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            position: sticky;
            bottom: 0;
            width: 100%;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--accent-tue);
        }

        .nav-item i {
            font-size: 18px;
        }

        @media(max-width: 768px) {
            h1 { font-size: 18px; }
            .progress-container { flex-direction: column; align-items: stretch; gap: 10px; }
            .progress-text { text-align: center; }
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-overlay">
        <div class="login-card">
            <h2>Study2026 Login</h2>
            <input type="text" id="username" placeholder="اسم المستخدم (Eslam)" autocomplete="off">
            <input type="password" id="password" placeholder="كلمة المرور (Study2026)">
            <button onclick="handleLogin()">دخول</button>
            <div id="error-msg" class="error-msg">اسم المستخدم أو كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div class="main-container" id="app-container" style="display: none;">
        <header>
            <h1><i class="fa-solid fa-graduation-cap" style="color: var(--accent-tue);"></i> Study2026 | الجدول الأسبوعي</h1>
            <div class="user-info">
                <span id="welcome-user"></span>
                <button class="logout-btn" onclick="handleLogout()">تسجيل خروج</button>
            </div>
        </header>

        <!-- شريط التقدم -->
        <div class="progress-container">
            <span>نسبة الإنجاز الإجمالية:</span>
            <div class="progress-bar-wrapper">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <span class="progress-text" id="progress-text">0%</span>
        </div>

        <!-- هيكل الجدول الأسبوعي -->
        <div class="table-responsive">
            <div class="study-grid" id="study-grid">
                <!-- الرؤوس وأوقات الساعات ستحقن ديناميكياً أو تبنى هنا -->
                <div class="grid-header" style="background: var(--bg-color);">الوقت / اليوم</div>
                <div class="grid-header day-sun">الأحد</div>
                <div class="grid-header day-mon">الإثنين</div>
                <div class="grid-header day-tue">الثلاثاء</div>
                <div class="grid-header day-wed">الأربعاء</div>
                <div class="grid-header day-thu">الخميس</div>
                <div class="grid-header day-fri">الجمعة</div>
                <div class="grid-header day-sat">السبت</div>
            </div>
        </div>

        <!-- أزرار الإضافة -->
        <div class="actions-bar">
            <button class="add-btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> Add New Task | إضافة مهمة</button>
        </div>
    </div>

    <!-- نافذة إضافة مهمة جديدة -->
    <div id="task-modal">
        <div class="modal-content">
            <h3>إضافة مهمة جديدة للجدول</h3>
            <label>اختر اليوم:</label>
            <select id="task-day">
                <option value="0">الأحد</option>
                <option value="1">الإثنين</option>
                <option value="2">الثلاثاء</option>
                <option value="3">الأربعاء</option>
                <option value="4">الخميس</option>
                <option value="5">الجمعة</option>
                <option value="6">السبت</option>
            </select>

            <label>اختر الساعة:</label>
            <select id="task-time">
                <option value="0">8:00 AM</option>
                <option value="1">9:00 AM</option>
                <option value="2">10:00 AM</option>
                <option value="3">11:00 AM</option>
                <option value="4">12:00 PM</option>
                <option value="5">1:00 PM</option>
                <option value="6">2:00 PM</option>
                <option value="7">3:00 PM</option>
                <option value="8">4:00 PM</option>
                <option value="9">5:00 PM</option>
                <option value="10">6:00 PM</option>
            </select>

            <label>اسم المادة / المهمة:</label>
            <input type="text" id="task-title-input" placeholder="مثال: رياضيات - جبر">

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
                <button class="btn-save" onclick="saveNewTask()">حفظ</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <div class="bottom-nav" id="bottom-nav" style="display: none;">
        <a class="nav-item active" onclick="switchNav(this)">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a class="nav-item" onclick="switchNav(this)">
            <i class="fa-solid fa-chart-line"></i>
            <span>Tracker</span>
        </a>
        <a class="nav-item" onclick="switchNav(this)">
            <i class="fa-solid fa-folder-open"></i>
            <span>Resources</span>
        </a>
    </div>

    <script>
        const hours = [
            "8:00 AM", "9:00 AM", "10:00 AM", "11:00 AM", "12:00 PM",
            "1:00 PM", "2:00 PM", "3:00 PM", "4:00 PM", "5:00 PM", "6:00 PM"
        ];

        // بيانات افتراضية أولية مستوحاة من الصورة المرفقة
        let initialData = {
            // يوم الأحد (0) إلى السبت (6) - كل عنصر عبارة عن مصفوفة صفوف الساعات
            // كل ساعة تحتوي على مصفوفة مهام [{text: "...", completed: false}]
        };

        // تهيئة الجدول الافتراضي إذا لم يوجد في Local Storage
        function getInitialTasks() {
            let data = {};
            for (let d = 0; d < 7; d++) {
                data[d] = {};
                for (let h = 0; h < hours.length; h++) {
                    data[d][h] = [];
                }
            }
            // إدراج بعض أمثلة الصورة مطابقة
            data[1][0] = [{ text: "الروتين الصباحي", completed: true }];
            data[1][1] = [{ text: "رياضيات - جبر", completed: false }];
            data[1][2] = [{ text: "اللغة العربية - قواعد", completed: false }];
            data[1][3] = [{ text: "علوم - كيمياء", completed: false }];
            data[1][4] = [{ text: "استراحة", completed: true }];
            data[1][10] = [{ text: "راحة واسترخاء", completed: true }];
            
            data[2][1] = [{ text: "Math - Algebra", completed: false }];
            data[3][1] = [{ text: "رياضيات", completed: false }];
            data[4][1] = [{ text: "Math", completed: false }];
            data[5][1] = [{ text: "جبر", completed: false }];
            data[6][1] = [{ text: "جبر", completed: false }];
            return data;
        }

        let tasksData = JSON.parse(localStorage.getItem('study2026_tasks')) || getInitialTasks();

        // التحقق من تسجيل الدخول عند التحميل
        window.onload = function() {
            let loggedInUser = localStorage.getItem('study2026_user');
            if (loggedInUser === 'Eslam') {
                showApp(loggedInUser);
            }
        }

        function handleLogin() {
            let user = document.getElementById('username').value.trim();
            let pass = document.getElementById('password').value.trim();
            let err = document.getElementById('error-msg');

            if (user === 'Eslam' && pass === 'Study2026') {
                localStorage.setItem('study2026_user', 'Eslam');
                showApp('Eslam');
            } else {
                err.style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('study2026_user');
            document.getElementById('login-overlay').style.display = 'flex';
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('bottom-nav').style.display = 'none';
        }

        function showApp(username) {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            document.getElementById('bottom-nav').style.display = 'flex';
            document.getElementById('welcome-user').innerText = `مرحباً، ${username}`;
            buildGrid();
            updateProgress();
        }

        function buildGrid() {
            let grid = document.getElementById('study-grid');
            // الحفاظ على رؤوس الجدول الأولى (8 خلايا: عنوان + 7 أيام)
            let headersHTML = `
                <div class="grid-header" style="background: var(--bg-color);">الوقت / اليوم</div>
                <div class="grid-header day-sun">الأحد</div>
                <div class="grid-header day-mon">الإثنين</div>
                <div class="grid-header day-tue">الثلاثاء</div>
                <div class="grid-header day-wed">الأربعاء</div>
                <div class="grid-header day-thu">الخميس</div>
                <div class="grid-header day-fri">الجمعة</div>
                <div class="grid-header day-sat">السبت</div>
            `;
            
            let rowsHTML = headersHTML;

            for (let h = 0; h < hours.length; h++) {
                rowsHTML += `<div class="time-col">${hours[h]}</div>`;
                for (let d = 0; d < 7; d++) {
                    let cellTasks = tasksData[d] && tasksData[d][h] ? tasksData[d][h] : [];
                    let tasksHtmlString = '';
                    
                    cellTasks.forEach((task, tIndex) => {
                        tasksHtmlString += `
                            <div class="task-item ${task.completed ? 'completed' : ''}">
                                <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${d}, ${h}, ${tIndex})">
                                <span class="task-name">${task.text}</span>
                                <button class="delete-task" onclick="deleteTask(${d}, ${h}, ${tIndex})"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `;
                    });

                    rowsHTML += `<div class="grid-cell">${tasksHtmlString}</div>`;
                }
            }

            grid.innerHTML = rowsHTML;
        }

        function toggleTask(day, hour, index) {
            tasksData[day][hour][index].completed = !tasksData[day][hour][index].completed;
            saveAndRefresh();
        }

        function deleteTask(day, hour, index) {
            tasksData[day][hour].splice(index, 1);
            saveAndRefresh();
        }

        function openModal() {
            document.getElementById('task-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('task-modal').style.display = 'none';
            document.getElementById('task-title-input').value = '';
        }

        function saveNewTask() {
            let day = document.getElementById('task-day').value;
            let hour = document.getElementById('task-time').value;
            let title = document.getElementById('task-title-input').value.trim();

            if (!title) {
                alert('الرجاء إدخال اسم المادة أو المهمة!');
                return;
            }

            if (!tasksData[day]) tasksData[day] = {};
            if (!tasksData[day][hour]) tasksData[day][hour] = [];

            tasksData[day][hour].push({ text: title, completed: false });
            saveAndRefresh();
            closeModal();
        }

        function saveAndRefresh() {
            localStorage.setItem('study2026_tasks', JSON.stringify(tasksData));
            buildGrid();
            updateProgress();
        }

        function updateProgress() {
            let totalTasks = 0;
            let completedTasks = 0;

            for (let d = 0; d < 7; d++) {
                for (let h = 0; h < hours.length; h++) {
                    if (tasksData[d] && tasksData[d][h]) {
                        tasksData[d][h].forEach(t => {
                            totalTasks++;
                            if (t.completed) completedTasks++;
                        });
                    }
                }
            }

            let percentage = totalTasks === 0 ? 0 : Math.round((completedTasks / totalTasks) * 100);
            document.getElementById('progress-fill').style.width = percentage + '%';
            document.getElementById('progress-text').innerText = percentage + '%';
        }

        function switchNav(element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
